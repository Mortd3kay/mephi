<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Конструктор посещения события</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <h1 id="event-title">Ночь в музее</h1>
      <p>15 ноября, 18:30</p>
      <p>Музей космонавтики, проспект Мира, 111</p>
      <p>Вечерняя программа с выставкой и экскурсиями</p>
      <button id="show-program" type="button">Показать программу</button>
      <p id="program" hidden></p>
    </section>

    <p id="data-error" class="error" role="alert" hidden></p>

    <form id="service-form" class="card service-form" hidden>
      <h2>Выберите услуги</h2>
      <label class="service"><input id="guide" type="checkbox"> Экскурсия с гидом — 500 руб.</label>
      <label class="service"><input id="audio" type="checkbox"> Аудиогид — 350 руб.</label>
      <label class="service"><input id="catalog" type="checkbox"> Каталог выставки — 250 руб.</label>
      <button type="submit">Рассчитать стоимость</button>
    </form>

    <p id="choice-error" class="error" role="alert" hidden></p>
    <p id="result" class="card" aria-live="polite" hidden></p>
    <pre id="report-json" hidden></pre>
  </main>
  <script src="app.js"></script>
</body>
</html>
